<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
            padding: 40px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: #ff6b00;
            border-radius: 20px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }
        
        h1 {
            color: #ff6b00;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        p {
            color: #ffa366;
            font-size: 1.2em;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .redirect-text {
            margin-top: 30px;
            font-size: 0.9em;
            color: #666;
        }
        
        .spinner {
            margin-top: 20px;
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #ff6b00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: auto;
            margin-right: auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔗</div>
        <h1>Переадресування...</h1>
        <p>Будь ласка, зачекайте, поки ми створимо ваше безпечне посилання</p>
        <div class="spinner"></div>
        <p class="redirect-text">Це посилання буде дійсним 5 хвилин</p>
    </div>
    
    <script>
        window.location.href = '/start';
    </script>
</body>
</html>
